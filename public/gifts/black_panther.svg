<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bp-body" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1c1420"/>
      <stop offset="60%" stop-color="#08050a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="bp-eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0b3ff"/>
      <stop offset="60%" stop-color="#7a00ff"/>
      <stop offset="100%" stop-color="#1a0033"/>
    </radialGradient>
    <filter id="bp-glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <ellipse cx="256" cy="380" rx="220" ry="90" fill="url(#bp-body)"/>
  <ellipse cx="256" cy="220" rx="150" ry="140" fill="url(#bp-body)"/>
  <!-- ears -->
  <path d="M130 130 q-8 -55 55 -55 q10 35 -15 75z" fill="#0a050c"/>
  <path d="M382 130 q8 -55 -55 -55 q-10 35 15 75z" fill="#0a050c"/>
  <!-- violet glow rim -->
  <ellipse cx="256" cy="220" rx="155" ry="145" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5" filter="url(#bp-glow)"/>
  <!-- eyes -->
  <ellipse cx="200" cy="210" rx="34" ry="22" fill="url(#bp-eye)"/>
  <ellipse cx="312" cy="210" rx="34" ry="22" fill="url(#bp-eye)"/>
  <ellipse cx="200" cy="212" rx="7" ry="16" fill="#000"/>
  <ellipse cx="312" cy="212" rx="7" ry="16" fill="#000"/>
  <circle cx="210" cy="204" r="4" fill="#fff"/>
  <circle cx="322" cy="204" r="4" fill="#fff"/>
  <!-- nose triangle -->
  <path d="M236 268 q20 -14 40 0 q-4 16 -20 20 q-16 -4 -20 -20z" fill="#150510"/>
  <path d="M256 288 v16" stroke="#000" stroke-width="3"/>
  <!-- mouth + fangs -->
  <path d="M256 304 q-22 18 -42 4 M256 304 q22 18 42 4" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="240,304 246,326 252,304" fill="#fff"/>
  <polygon points="272,304 266,326 260,304" fill="#fff"/>
  <!-- claws on body -->
  <g fill="#fff" opacity="0.85">
    <polygon points="100,420 92,450 110,438"/>
    <polygon points="125,432 120,460 138,448"/>
    <polygon points="412,420 420,450 402,438"/>
    <polygon points="387,432 392,460 374,448"/>
  </g>
</svg>
